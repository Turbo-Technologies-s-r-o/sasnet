[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sasnet"
version = "0.3.0"
description = "1D secondary air system network solver for gas turbines and turbomachinery"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
authors = [{ name = "Turbo Technologies s.r.o." }]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
